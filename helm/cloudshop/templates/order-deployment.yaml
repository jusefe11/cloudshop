apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudshop
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.order.image.repository }}:{{ .Values.order.image.tag }}"
          imagePullPolicy: {{ .Values.order.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.order.service.port }}
          resources:
            requests:
              cpu: {{ .Values.order.resources.requests.cpu }}
              memory: {{ .Values.order.resources.requests.memory }}
            limits:
              cpu: {{ .Values.order.resources.limits.cpu }}
              memory: {{ .Values.order.resources.limits.memory }}
